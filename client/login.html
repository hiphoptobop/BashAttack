<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BashAttack</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .title {
            font-size: 2.2em;
            font-weight: 700;
            color: #e94560;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #a8a8b3;
            font-size: 0.95em;
            margin-bottom: 40px;
        }

        .error-message {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid #e94560;
            color: #ff6b81;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.9em;
            display: none;
        }

        .error-message.show { display: block; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
            color: #fff;
        }

        .btn:hover  { opacity: 0.88; }
        .btn:active { transform: scale(0.98); }

        .btn-discord {
            background: #5865F2;
            margin-bottom: 16px;
        }

        .btn-raid {
            background: #0f3460;
            border: 1px solid #e94560;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: #4a4a6a;
            font-size: 0.85em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-top: 1px solid #0f3460;
        }

        .footer-note {
            margin-top: 32px;
            color: #4a4a6a;
            font-size: 0.8em;
        }

        .loading { display: none; margin-top: 24px; color: #a8a8b3; font-size: 0.9em; }
        .loading.show { display: block; }

        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid #4a4a6a;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">⚔️ BashAttack</div>
        <div class="subtitle">Choose how you want to log in</div>

        <div class="error-message" id="errorMessage"></div>

        <!-- Discord OAuth — handled entirely server-side -->
        <a href="/auth/discord" class="btn btn-discord">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            Login with Discord
        </a>

        <div class="divider"><span>OR</span></div>

        <!-- Raid — opens their site directly in a new tab -->
        <a href="https://raid.gamernight.net/" target="_blank" rel="noopener noreferrer" class="btn btn-raid">
            🎮 Login with raid.gamernight.net
        </a>

        <div class="loading" id="loading">
            <span class="spinner"></span>Authenticating…
        </div>

        <div class="footer-note">Your progress is saved automatically.</div>
    </div>

    <script src="/scripts/auth.js"></script>
</body>
</html>
