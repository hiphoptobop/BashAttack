name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install native build tools (required for bcrypt)
        run: sudo apt-get install -y build-essential python3
      - run: npm ci
      - run: npm test
